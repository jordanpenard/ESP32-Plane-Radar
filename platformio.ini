; ESP32-S3 Super Mini + 2.1" round GC9B72 (360x360)

[env:supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Configure hardware specs (4MB Flash, 2MB Quad PSRAM)
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions/plane_radar.csv

extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; Enable the S3's external psram
; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

; While the GC9B72 code is getting into a LGFX release, pointing at the dev branch
lib_deps =
  #lovyan03/LovyanGFX@^1.2.7
  https://github.com/lovyan03/LovyanGFX.git#develop
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

